nodeLinker: node-modules
nmHoistingLimits: workspaces

packageExtensions:
  # We format with oxfmt, so Prettier itself is not installed. The eslint config
  # only needs eslint-config-prettier, which it depends on directly.
  '@react-native/eslint-config@*':
    peerDependenciesMeta:
      prettier:
        optional: true

yarnPath: .yarn/releases/yarn-4.11.0.cjs
